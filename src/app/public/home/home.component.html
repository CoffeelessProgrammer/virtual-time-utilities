<div class="row justify-content-center mt-5">

    <div class="col">
        <h1 class="text-center">List of Utilities</h1>
    </div>

    <div class="w-100 my-3"></div>

    <ng-container *ngFor="let utility of utilities; let i=index">

        <div class="col-10 col-md-6 col-lg-4">
            <mat-card [routerLink]="utility.routePath" class="card-hover">
                <mat-card-header>
                    <mat-card-title>{{utility.title}}</mat-card-title>
                    <mat-card-subtitle>{{utility.category}}</mat-card-subtitle>
                </mat-card-header>
                <mat-card-content>
                    <p class="pl-3">{{utility.description}}</p>
                </mat-card-content>
            </mat-card>
        </div>

        <div class="w-100 my-3 d-md-none"></div>

        <div *ngIf="(i+1)%2 === 0" class="w-100 my-3 d-none d-md-block d-lg-none"></div>

        <div *ngIf="(i+1)%3 === 0" class="w-100 my-3 d-none d-lg-block"></div>

    </ng-container>

    <div class="w-100 my-4"></div>
    
</div>
